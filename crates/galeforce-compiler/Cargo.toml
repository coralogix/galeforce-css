[package]
name = "galeforce-compiler"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Utility + variant compiler for GaleforceCSS."
# Not published to crates.io: the crate names are unreserved and the public
# surface is the npm packages. Guards against an accidental `cargo publish`.
publish = false

[dependencies]
galeforce-core = { workspace = true }
galeforce-css = { workspace = true }
galeforce-parser = { workspace = true }
galeforce-sort = { workspace = true }
galeforce-theme = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
indexmap = { workspace = true }
smallvec = { workspace = true }
rayon = { workspace = true }
memchr = { workspace = true }
rustc-hash = { workspace = true }
base64 = { workspace = true }
lightningcss = { workspace = true }
parcel_sourcemap = { workspace = true }

[[bench]]
name = "compile"
harness = false
