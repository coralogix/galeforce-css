[package]
name = "galeforce-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "GaleforceCSS command-line interface."
# Not published to crates.io: the crate names are unreserved and the public
# surface is the npm packages. Guards against an accidental `cargo publish`.
publish = false

[[bin]]
name = "galeforcecss"
path = "src/main.rs"

[dependencies]
galeforce-core = { workspace = true }
galeforce-compiler = { workspace = true }
galeforce-scanner = { workspace = true }
anyhow = { workspace = true }
serde_json = { workspace = true }
clap = { workspace = true }
notify-debouncer-mini = { workspace = true }
mimalloc = { workspace = true }
rayon = { workspace = true }
