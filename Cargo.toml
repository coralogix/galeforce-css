[workspace]
resolver = "2"
members = [
    "crates/galeforce-core",
    "crates/galeforce-scanner",
    "crates/galeforce-parser",
    "crates/galeforce-theme",
    "crates/galeforce-compiler",
    "crates/galeforce-css",
    "crates/galeforce-sort",
    "crates/galeforce-cli",
    "crates/galeforce-node",
]

[workspace.package]
version = "0.0.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"
repository = "https://github.com/galeforcecss/galeforcecss"
authors = ["GaleforceCSS contributors"]

[workspace.dependencies]
serde = { version = "=1.0.215", features = ["derive"] }
serde_json = "=1.0.133"
thiserror = "=1.0.69"
anyhow = "=1.0.94"
indexmap = { version = "=2.7.0", features = ["serde"] }
smallvec = { version = "=1.13.2", features = ["serde"] }
ahash = "=0.8.12"
rustc-hash = "=2.1.1"
once_cell = "=1.20.2"
ignore = "=0.4.23"
globset = "=0.4.15"
memchr = "=2.7.4"
tempfile = "=3.14.0"
clap = { version = "=4.5.21", features = ["derive"] }
notify = "=6.1.1"
notify-debouncer-mini = "=0.4.1"
rayon = "=1.10.0"
mimalloc = "=0.1.43"
base64 = "=0.22.1"
lightningcss = { version = "=1.0.0-alpha.71", default-features = false, features = ["sourcemap"] }
parcel_sourcemap = "=2.1.1"
napi = { version = "=3.4.0", default-features = false, features = ["napi8", "serde-json"] }
napi-derive = "=3.3.0"
napi-build = "=2.2.4"

# Internal crate deps
galeforce-core = { path = "crates/galeforce-core" }
galeforce-scanner = { path = "crates/galeforce-scanner" }
galeforce-parser = { path = "crates/galeforce-parser" }
galeforce-theme = { path = "crates/galeforce-theme" }
galeforce-compiler = { path = "crates/galeforce-compiler" }
galeforce-css = { path = "crates/galeforce-css" }
galeforce-sort = { path = "crates/galeforce-sort" }
galeforce-cli = { path = "crates/galeforce-cli" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[profile.bench]
inherits = "release"
debug = true
