name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --no-fail-fast

  js:
    name: JS / Conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm oracle:version
      # Build workspace packages so TypeScript can resolve their type declarations.
      - run: pnpm build
      - run: pnpm typecheck
      # The conformance bridge spawns target/release/galeforcecss. Build it
      # before tests so the bridge resolves the binary, otherwise fixtures
      # would silently fall back to the `unimplemented` placeholder.
      - run: cargo build -p galeforce-cli --release
      - run: pnpm test
      - run: pnpm conformance:test
