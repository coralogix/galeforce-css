# Configuration for hawkeye (https://github.com/korandoru/hawkeye), the license
# header linter. Run `pnpm license:fix` to insert missing headers and
# `pnpm license:check` to verify; CI runs the check on every PR.

headerPath = "license-header.txt"

# Override SLASHSTAR_STYLE so a leading `#!` shebang stays on line 1 and the
# header is inserted after it (see file for details).
additionalHeaders = ["licenserc-headers.toml"]

# hawkeye's built-in excludes already cover .git, lockfiles, etc. We add the
# vendored Tailwind submodule and dependency/build output explicitly.
useDefaultExcludes = true

includes = [
  "**/*.rs",
  "**/*.ts",
  "**/*.tsx",
  "**/*.js",
  "**/*.mjs",
  "**/*.cjs",
]

excludes = [
  # Vendored upstream Tailwind v3 source (its own MIT license applies).
  "vendor/**",
  # Dependencies and build artifacts.
  "**/node_modules/**",
  "target/**",
  "**/dist/**",
  "**/*.d.ts",
]

# Strings used to detect a header is already present (avoids double-insertion).
keywords = ["Copyright", "Licensed under the Apache License"]

# hawkeye has no built-in comment style for .mjs; map it to the same
# block-comment style it uses for .js/.ts/.cjs.
[mapping.SLASHSTAR_STYLE]
extensions = ["mjs"]
